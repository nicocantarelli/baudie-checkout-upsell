# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "baudie-checkout-upsell"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

[access_scopes]
# read_products: kept for parity with baudie-discounts and potential future Admin API needs.
# Checkout UI extensions read product data via the Storefront API (api_access capability), not Admin scopes.
scopes = "read_products"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]
